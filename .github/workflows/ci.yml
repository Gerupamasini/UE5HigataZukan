name: CI

on:
  pull_request:
  push:

jobs:
  tide:
    name: Tide core (C++) against the web build's fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests/tide -B build/tide
      - run: cmake --build build/tide
      - run: ctest --test-dir build/tide --output-on-failure

  ascii-sources:
    name: C++ sources are ASCII (MSVC on Japanese Windows reads them as CP932)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "! grep -rnP '[^\\x00-\\x7F]' Source tests --include='*.h' --include='*.cpp' --include='*.cs'"
